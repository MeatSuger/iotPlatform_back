services:
  iot-platform-go:
    build:
      context: ../..
      dockerfile: deployments/app/Dockerfile
    container_name: iot-platform-go
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      - CONFIG_PATH=configs/config.prod.yaml
      - HISTORY_DOWNSAMPLE=${HISTORY_DOWNSAMPLE:-on}
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - 1panel-network
    volumes:
      - ../../configs:/app/configs:ro
      - ../../build/iot-platform:/app/iot-platform:ro
    restart: unless-stopped

networks:
  1panel-network:
    external: true
