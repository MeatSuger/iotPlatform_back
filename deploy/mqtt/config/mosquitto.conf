# ===========================================
# Mosquitto MQTT Broker 配置
# ===========================================

# 持久化
persistence true
persistence_location /mosquitto/data/

# 日志
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# MQTT监听器
listener 1883
protocol mqtt

# WebSocket监听器
listener 9001
protocol websockets

# 允许匿名访问（开发环境）
allow_anonymous true

# 连接超时
connection_messages true

# 最大消息大小（1MB）
max_packet_size 1048576
