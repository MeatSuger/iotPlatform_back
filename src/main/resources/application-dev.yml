server:
  servlet:
    context-path: /api
  port: 8181
spring:
  application:
    name: IotPlatform
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://47.99.74.160:5432/iotuser
    username: user_mBQFp4
    password: password_5NREGY
    hikari:
      pool-name: IotPlatformHikariPool-Dev
      minimum-idle: 5
      maximum-pool-size: 20
      initialization-fail-timeout: 1
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 300000
      auto-commit: true
      connection-test-query: SELECT 1
      data-source-properties:
        reWriteBatchedInserts: true
        prepareThreshold: 3
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5
        tcpKeepAlive: true
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
  data:
    redis:
      database: 0
      host: 47.99.74.160
      # Redis 服务器端口
      port: 6379
      # Redis 服务器密码（若未设置密码，可省略）
      password: redis_DbbDB3
      # 连接超时时间（毫秒）
      timeout: 10s
      # Lettuce 连接池配置
      lettuce:
        pool:
          # 最大连接数
          max-active: 200
          # 最大空闲连接
          max-idle: 8
          # 最小空闲连接
          min-idle: 2
          # 最大等待时间（-1 表示无限制）
          max-wait: -1ms
    influx:
      url: http://47.99.74.160:8086
      token: edBQ1U5Vw21Yycg8_BIV2kET6X4-HW071OrYa26HnRhmi1PTeKwXVZ9esF0VIdy1wKn36-yS0Bv4uje6RT2Yfw==
      org: influxdb_yHi3BP
      bucket: iot-sensor
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # 是否输出操作日志
  is-log: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
#logging:
#  level:
#    root: debug
#    web: debug
#    sql: debug+
springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
  swagger-ui:
    enabled: true

iot:
  mqtt:
    enabled: true
    broker-url: tcp://47.99.74.160:1883
    client-id: iot-platform-backend-dev
    username: dev_mqtt_user
    password: dev_mqtt_password
    topics:
      - iot/+/telemetry
    qos: 1
    clean-session: true
    connection-timeout-seconds: 10
    keep-alive-seconds: 60
    reconnect-delay-seconds: 5
