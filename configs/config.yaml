# ===========================================
# IoT Platform (Go) 配置文件
# ===========================================

server:
  port: 8182           # 服务端口（dev使用8182避免与Java版8181冲突）
  udp-port: 8183       # UDP 设备上报端口（0=禁用）
  mode: debug          # debug | release | test
  log-level: debug     # 日志级别: debug | info | warn | error（默认: debug→debug, release→info）
  swagger-enabled: true  # 是否启用 Swagger 文档

database:
  host: "1Panel-postgresql-atvS"
  port: 5432
  user: "user_TdeFN2"
  password: "password_Ae4NhC"
  dbname: "iotuser"
  sslmode: "disable"
  max-open: 32
  max-idle: 8

redis:
  host: "1Panel-redis-143d"
  port: 6379
  password: "redis_DbbDB3"
  db: 0
  pool-size: 500          # 1000并发场景下增大连接池
  min-idle-conns: 50      # 预热最小空闲连接
  dial-timeout: 5
  read-timeout: 3
  write-timeout: 3
  pool-timeout: 4
  max-retries: 3

influxdb:
  url: "http://influxdb3-core:8181"
  token: "apiv3_1wM9E7Lp5PKlUHZIt4sFJgdH-hBQlLNhpMEfEjDg1CKIGe5S8fktY_q7ghBOhcitHlZo7AKqAcpm9YP0FzFtPw"
  database: "iotData"
  auth-scheme: "Bearer"  # v3 Core 自部署用 Bearer，Cloud 用 Token

# MQTT Broker 连接地址（仅此一项，供网关透明转发到外部 MQTT Docker）
mqtt:
  broker-url: "tcp://mqtt:1883"

# MQTT 桥接网关（胶水层）：设备 WSS 接入 → 框架鉴权（Sa-Token）→ 透明转发到外部 MQTT Docker
# 设备连接: wss://<host>/api/ws/mqtt/broker?X-Device-Token=<token>（与 HTTP 同端口），鉴权由 DeviceAuthMiddleware 接管
mqtt-gateway:
  enabled: true

cors:
  allowed-origins:
    - "https://iot.meatsuger.top"
    - "http://localhost:5173"
    - "http://localhost:3000"
