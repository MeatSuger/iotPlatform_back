# ===========================================
# IoT Platform (Go) 配置文件
# ===========================================

server:
  port: 8182           # 服务端口（dev使用8182避免与Java版8181冲突）
  udp-port: 8183       # UDP 设备上报端口（0=禁用）
  mode: debug          # debug | release | test

database:
  host: "1Panel-postgresql-atvS"
  port: 5432
  user: "user_TdeFN2"
  password: "password_Ae4NhC"
  dbname: "iotuser"
  sslmode: "disable"
  max-open: 32
  max-idle: 8

redis:
  host: "1Panel-redis-143d"
  port: 6379
  password: "redis_DbbDB3"
  db: 0
  pool-size: 500          # 1000并发场景下增大连接池
  min-idle-conns: 50      # 预热最小空闲连接
  dial-timeout: 5
  read-timeout: 3
  write-timeout: 3
  pool-timeout: 4
  max-retries: 3

influxdb:
  url: "http://1Panel-influxdb-ks5i:8086"
  token: "edBQ1U5Vw21Yycg8_BIV2kET6X4-HW071OrYa26HnRhmi1PTeKwXVZ9esF0VIdy1wKn36-yS0Bv4uje6RT2Yfw=="
  org: "influxdb_yHi3BP"
  bucket: "iot-sensor"

# MQTT Broker 连接地址（仅此一项，供网关透明转发到外部 MQTT Docker）
mqtt:
  broker-url: "tcp://mqtt:1883"

# MQTT 桥接网关（胶水层）：设备 WSS 接入 → 框架鉴权（Sa-Token）→ 透明转发到外部 MQTT Docker
# 设备连接: wss://<host>/api/ws/mqtt/broker?X-Device-Token=<token>（与 HTTP 同端口），鉴权由 DeviceAuthMiddleware 接管
mqtt-gateway:
  enabled: true

cors:
  allowed-origins:
    - "https://iot.meatsuger.top"
    - "http://localhost:5173"
    - "http://localhost:3000"
