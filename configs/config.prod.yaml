# ===========================================
# IoT Platform (Go) 生产环境配置
# ===========================================

server:
  port: 9091
  udp-port: 9092       # UDP 设备上报端口
  mode: release
  log-level: info       # 日志级别: debug | info | warn | error
                        # 生产环境建议 info：只输出必要日志（启动/关闭、连接、登录、命令下发、4xx/5xx 失败请求）
                        # 高频数据路径（UDP上报/WS消息/MQTT入库/成功请求）为 debug 级，生产不输出
  swagger-enabled: false  # 生产环境关闭 Swagger 文档

database:
  host: "1Panel-postgresql-atvS"
  port: 5432
  user: "user_TdeFN2"
  password: "password_Ae4NhC"
  dbname: "iotuser"
  sslmode: "disable"
  max-open: 32
  max-idle: 8

redis:
  host: "1Panel-redis-143d"
  port: 6379
  password: "redis_DbbDB3"
  db: 0
  pool-size: 200          # 连接池大小（200 足够 100 VUs 并发，避免占用过多 Redis maxclients）
  min-idle-conns: 30      # 预热最小空闲连接，减少冷启动延迟
  dial-timeout: 5
  read-timeout: 3
  write-timeout: 3
  pool-timeout: 4
  max-retries: 3

influxdb:
  url: "http://influxdb3-core:8181"
  token: "apiv3_1wM9E7Lp5PKlUHZIt4sFJgdH-hBQlLNhpMEfEjDg1CKIGe5S8fktY_q7ghBOhcitHlZo7AKqAcpm9YP0FzFtPw"
  database: "iotData"
  auth-scheme: "Bearer"  # v3 Core 自部署用 Bearer，Cloud 用 Token
  max-idle-connections: 50

# 设备离线检测（Redis 状态为准，离线后同步 PostgreSQL）
device:
  offline-scan-interval: 30   # 扫描间隔（秒）
  offline-threshold: 120      # 离线判定阈值（秒），心跳周期 60s 的 2 倍

# MQTT Broker 连接地址（仅此一项，供网关透明转发到外部 MQTT Docker）
mqtt:
  broker-url: "tcp://mqtt:1883"

# MQTT 桥接网关（胶水层）：设备 WSS 接入 → 框架鉴权（Sa-Token）→ 透明转发到外部 MQTT Docker
mqtt-gateway:
  enabled: true

cors:
  allowed-origins:
    - "https://iot.meatsuger.top"
