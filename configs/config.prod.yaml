# MQTT 鉴权网关（胶水层）：设备 WSS 接入 → 鉴权 → 透明转发到外部 MQTT Docker
mqtt-gateway:
  enabled: true
  require-auth: true

cors:
  allowed-origins:
    - "https://iot.meatsuger.top"
