      security:
      - UserAuth: []
      summary: 下发执行器配置（编译进 DeviceConfig 并版本化下发）
      tags:
      - devices
  /api/devices/{deviceId}/commands:
    get:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: 设备拉取待消费命令
      tags:
      - device
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 命令内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.DownlinkCmdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 向设备下发命令
      tags:
      - device
  /api/devices/{deviceId}/config:
    get:
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
