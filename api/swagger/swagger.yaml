          $ref: '#/definitions/entity.DeviceConfigSaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 设置设备配置并下发
      tags:
      - devices
  /api/devices/{deviceId}/config/report:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 实际生效配置与版本
        in: body
        name: body
        required: true
