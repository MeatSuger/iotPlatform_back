basePath: /api
definitions:
  common.ApiResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  ent.User:
    properties:
      account:
        description: Account holds the value of the "account" field.
        type: string
      age:
        description: Age holds the value of the "age" field.
        type: integer
      createTime:
        description: CreateTime holds the value of the "create_time" field.
        type: string
      email:
        description: Email holds the value of the "email" field.
        type: string
      id:
        description: ID of the ent.
        type: integer
      name:
        description: Name holds the value of the "name" field.
        type: string
      role:
        description: Role holds the value of the "role" field.
        type: string
      status:
        description: Status holds the value of the "status" field.
        type: string
      updateTime:
        description: UpdateTime holds the value of the "update_time" field.
        type: string
    type: object
  entity.DeviceStatusDTO:
    properties:
      sensors:
        items:
          $ref: '#/definitions/entity.SensorData'
        type: array
    required:
    - sensors
    type: object
  entity.SensorData:
    properties:
      name:
        type: string
      timestamp:
        type: string
      type:
        type: string
      value: {}
    required:
    - name
    - type
    - value
    type: object
  mqtt.PublishRequest:
    properties:
      payload:
        type: string
      qos:
        description: 可选，默认0
        maximum: 2
        minimum: 0
        type: integer
      retained:
        description: 可选，默认false
        type: boolean
      topic:
        type: string
    required:
    - payload
    - topic
    type: object
  mqtt.SubscribeRequest:
    properties:
      qos:
        description: 可选，默认0
        maximum: 2
        minimum: 0
        type: integer
      topic:
        type: string
    required:
    - topic
    type: object
  mqtt.TopicRequest:
    properties:
      topic:
        type: string
    required:
    - topic
    type: object
  service.DeviceRegisterRequest:
    properties:
      deviceName:
        type: string
      deviceType:
        type: string
      firmwareVersion:
        type: string
      ipAddress:
        type: string
      location:
        type: string
      macAddress:
        type: string
    required:
    - deviceName
    type: object
  service.DownlinkCmdRequest:
    type: object
  service.LoginRequest:
    properties:
      account:
        type: string
      passwd:
        type: string
    required:
    - account
    - passwd
    type: object
  service.LoginResponse:
    properties:
      isLogin:
        type: boolean
      loginDevice:
        type: string
      loginId:
        type: string
      loginType:
        type: string
      sessionTimeout:
        type: integer
      tokenActivityTimeout:
        type: integer
      tokenName:
        type: string
      tokenSessionTimeout:
        type: integer
      tokenTimeout:
        type: integer
      tokenValue:
        type: string
      userInfo:
        $ref: '#/definitions/ent.User'
    type: object
  service.RegisterRequest:
    properties:
      account:
        maxLength: 50
        minLength: 3
        type: string
      email:
        type: string
      name:
        type: string
      passwd:
        maxLength: 100
        minLength: 6
        type: string
    required:
    - account
    - passwd
    type: object
host: localhost:8182
info:
  contact:
    email: support@iot-platform.local
    name: API Support
  description: IoT 物联网平台后端 API（Go 重构版）
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: IoT Platform Go API
  version: 1.0.0
paths:
  /api/data/{deviceId}/Data:
    post:
      consumes:
      - application/json
      parameters:
      - description: 传感器数据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entity.DeviceStatusDTO'
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: 上报传感器数据
      tags:
      - data
  /api/data/{deviceId}/Data/list:
    get:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 数量限制
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 查询设备传感器数据
      tags:
      - data
  /api/data/{deviceId}/heartbeat:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: 设备心跳
      tags:
      - data
  /api/data/{deviceId}/ping:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: 设备心跳
      tags:
      - data
  /api/data/list:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 通用数据查询入口
      tags:
      - data
  /api/data/ping:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: InfluxDB连通性检查
      tags:
      - data
  /api/device/{deviceId}/Data:
    get:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 获取设备详情
      tags:
      - devices
  /api/device/{deviceId}/cmd:
    get:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: 设备拉取待消费命令
      tags:
      - device
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 命令内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.DownlinkCmdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 向设备下发命令
      tags:
      - device
  /api/device/{deviceId}/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 删除设备
      tags:
      - devices
  /api/device/{deviceId}/login:
    get:
      consumes:
      - application/json
      description: 使用设备6位hex ID认证（路径参数），无需额外Token
      parameters:
      - description: 设备ID（6位hex）
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 获取设备Token
      tags:
      - devices
  /api/device/list:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 查询用户设备列表
      tags:
      - devices
  /api/device/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备注册请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.DeviceRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 注册设备
      tags:
      - devices
  /api/mqtt/{deviceId}/Data:
    post:
      consumes:
      - application/json
      parameters:
      - description: 传感器数据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entity.DeviceStatusDTO'
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: MQTT方式上报传感器数据
      tags:
      - mqtt
  /api/mqtt/{deviceId}/heartbeat:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: MQTT方式心跳
      tags:
      - mqtt
  /api/mqtt/{deviceId}/ping:
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - DeviceAuth: []
      summary: MQTT方式心跳
      tags:
      - mqtt
  /api/mqtt/client/connect:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 连接MQTT Broker
      tags:
      - mqtt
  /api/mqtt/client/disconnect:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 断开MQTT连接
      tags:
      - mqtt
  /api/mqtt/client/messages:
    get:
      consumes:
      - application/json
      parameters:
      - description: 数量限制
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 获取最近的MQTT消息
      tags:
      - mqtt
  /api/mqtt/client/publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: 发布消息请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mqtt.PublishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 发布消息
      tags:
      - mqtt
  /api/mqtt/client/status:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 获取MQTT客户端状态
      tags:
      - mqtt
  /api/mqtt/client/subscribe:
    post:
      consumes:
      - application/json
      parameters:
      - description: 订阅请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mqtt.SubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 订阅主题
      tags:
      - mqtt
  /api/mqtt/client/unsubscribe:
    post:
      consumes:
      - application/json
      parameters:
      - description: 取消订阅请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mqtt.TopicRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 取消订阅
      tags:
      - mqtt
  /api/user:
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ent.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/ent.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 更新用户信息
      tags:
      - users
  /api/user/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 删除用户
      tags:
      - users
  /api/user/isLogin:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 检查登录状态
      tags:
      - users
      - public
  /api/user/list:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ent.User'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 列出所有用户
      tags:
      - users
  /api/user/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 用户登录
      tags:
      - users
      - public
  /api/user/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 退出登录
      tags:
      - users
  /api/user/page:
    get:
      consumes:
      - application/json
      parameters:
      - description: 页码（从0开始）
        in: query
        name: pageNum
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 用户名
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 分页查询用户
      tags:
      - users
  /api/user/profile:
    get:
      consumes:
      - application/json
      parameters:
      - description: 用户ID
        in: query
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/ent.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 获取用户信息
      tags:
      - users
  /api/user/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/ent.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 用户注册
      tags:
      - users
      - public
securityDefinitions:
  DeviceAuth:
    description: 设备 Token（设备注册后获取）
    in: header
    name: X-Device-Token
    type: apiKey
  UserAuth:
    description: Bearer Token（用户 Sa-Token），登录后获取
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
