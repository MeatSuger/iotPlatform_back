          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 退出登录
      tags:
      - users
  /health:
    get:
      description: |-
        供容器编排/负载均衡探测，不走统一响应结构；
        探测 PostgreSQL/Redis/InfluxDB，任一失联时返回 HTTP 503
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - system
securityDefinitions:
  DeviceAuth:
    description: 设备 Token（设备注册后获取）
    in: header
    name: X-Device-Token
    type: apiKey
  UserAuth:
    description: Bearer Token（用户 Sa-Token），登录后获取
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
