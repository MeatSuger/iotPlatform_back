      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 执行器标识符
        in: path
        name: actuatorId
        required: true
        type: string
      - description: 更新字段（增量）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entity.ActuatorUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 增量更新执行器定义
      tags:
      - devices
  /api/devices/{deviceId}/actuators/apply:
    post:
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
