      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 获取设备Token
      tags:
      - devices
  /api/devices/{deviceId}/update:
    post:
      consumes:
      - application/json
      description: 仅设备所有者或设备自身可更新；增量更新，仅请求体中出现的字段会被更新，未传字段保持原值
      parameters:
      - description: 设备ID（6位hex）
        in: path
        name: deviceId
        required: true
        type: string
      - description: 待更新的设备字段（至少一个）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.DeviceUpdateParameters'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/ent.Device'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 更新设备信息（增量）
      tags:
      - devices
  /api/users:
    get:
      consumes:
      - application/json
      parameters:
      - description: 页码（从0开始，仅 pageSize > 0 时生效）
        in: query
        name: pageNum
        type: integer
      - description: 每页数量（>0 时返回分页 envelope，缺省返回全量数组）
        in: query
        name: pageSize
        type: integer
      - description: 用户名（模糊匹配，仅分页时生效）
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ent.User'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 列出所有用户
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 用户注册
      tags:
      - users
      - public
  /api/users/{userId}:
    get:
      consumes:
      - application/json
      parameters:
      - description: 用户ID（me=当前登录用户）
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/ent.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 获取用户信息
      tags:
      - users
  /api/users/{userId}/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户ID（本人或管理员可操作）
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 删除用户
      tags:
      - users
  /api/users/{userId}/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户ID（me=当前用户；本人或管理员可操作）
        in: path
        name: userId
        required: true
        type: string
      - description: 用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ent.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/ent.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
