          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      - DeviceAuth: []
      summary: 查询设备配置快照
      tags:
      - devices
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 配置内容
        in: body
        name: body
        required: true
