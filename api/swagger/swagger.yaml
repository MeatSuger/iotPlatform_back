  /api/devices/{deviceId}/sensorData:
    get:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        type: string
      - description: 数量限制，默认50
        in: query
        name: limit
        type: integer
      - description: 起始时间（RFC3339），默认3天前
        in: query
        name: start
        type: string
      - description: 结束时间（RFC3339），默认当前时间
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      summary: 查询设备传感器数据
      tags:
      - data
    post:
      consumes:
      - application/json
      parameters:
      - description: 传感器数据
        in: body
