basePath: /
definitions:
  common.ApiResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  ent.Device:
    properties:
      createdAt:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      deviceId:
        description: ID of the ent.
        type: string
      deviceName:
        description: DeviceName holds the value of the "device_name" field.
        type: string
      deviceType:
        description: DeviceType holds the value of the "device_type" field.
        type: string
      firmwareVersion:
        description: FirmwareVersion holds the value of the "firmware_version" field.
        type: string
      ipAddress:
        description: IPAddress holds the value of the "ip_address" field.
        type: string
      lastActiveTime:
        description: LastActiveTime holds the value of the "last_active_time" field.
        type: string
      location:
        description: Location holds the value of the "location" field.
        type: string
      macAddress:
        description: MACAddress holds the value of the "mac_address" field.
        type: string
      ownerId:
        description: OwnerID holds the value of the "owner_id" field.
        type: integer
      status:
        description: Status holds the value of the "status" field.
        type: string
      updatedAt:
        description: UpdatedAt holds the value of the "updated_at" field.
        type: string
    type: object
  ent.User:
    properties:
      account:
        description: Account holds the value of the "account" field.
        type: string
      age:
        description: Age holds the value of the "age" field.
        type: integer
      createTime:
        description: CreateTime holds the value of the "create_time" field.
        type: string
      email:
        description: Email holds the value of the "email" field.
        type: string
      id:
        description: ID of the ent.
        type: integer
      name:
        description: Name holds the value of the "name" field.
        type: string
      role:
        description: Role holds the value of the "role" field.
        type: string
      status:
        description: Status holds the value of the "status" field.
        type: string
      updateTime:
        description: UpdateTime holds the value of the "update_time" field.
        type: string
    type: object
  entity.ActuatorCreateRequest:
    properties:
      config:
        additionalProperties: {}
        type: object
      driver:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
    required:
    - driver
    - id
    type: object
  entity.ActuatorUpdateRequest:
    type: object
  entity.DeviceConfigReport:
    properties:
      config:
        additionalProperties: {}
        type: object
      version:
        type: integer
    required:
    - version
    type: object
  entity.DeviceConfigSaveRequest:
    properties:
      config:
        additionalProperties: {}
        type: object
    required:
    - config
    type: object
  entity.DeviceStatusDTO:
    properties:
      sensors:
        items:
          $ref: '#/definitions/entity.SensorData'
        type: array
    required:
    - sensors
    type: object
  entity.SensorCreateRequest:
    properties:
      attrs:
        additionalProperties: {}
        type: object
      dataType:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      reportInterval:
        type: integer
      specs:
        additionalProperties: {}
        type: object
      thresholds:
        additionalProperties: {}
        type: object
      type:
        type: string
      unit:
        type: string
    required:
    - id
    - name
    - type
    type: object
  entity.SensorData:
    properties:
      name:
        type: string
      timestamp:
        type: string
      type:
        type: string
      value: {}
    required:
    - name
    - type
    - value
    type: object
  entity.SensorUpdateRequest:
    type: object
  service.DeviceParameters:
    properties:
      deviceName:
        type: string
      deviceType:
        type: string
      firmwareVersion:
        type: string
      ipAddress:
        type: string
      location:
        type: string
      macAddress:
        type: string
    required:
    - deviceName
    type: object
  service.DeviceRegisterResponse:
    properties:
      deviceId:
        type: string
      deviceToken:
        type: string
    type: object
  service.DeviceUpdateParameters:
    properties:
      deviceName:
        type: string
      deviceType:
        type: string
      firmwareVersion:
        type: string
      ipAddress:
        type: string
      location:
        type: string
      macAddress:
        type: string
    type: object
  service.DownlinkCmdRequest:
    type: object
  service.LoginRequest:
    properties:
      account:
        type: string
      device:
        type: string
      passwd:
        type: string
    required:
    - account
    - passwd
    type: object
  service.LoginResponse:
    properties:
      isLogin:
        type: boolean
      loginDevice:
        type: string
      loginId:
        type: string
      loginType:
        type: string
      sessionTimeout:
        type: integer
      tokenActivityTimeout:
        type: integer
      tokenName:
        type: string
      tokenSessionTimeout:
        type: integer
      tokenTimeout:
        type: integer
      tokenValue:
        type: string
      userInfo:
        $ref: '#/definitions/ent.User'
    type: object
  service.RegisterRequest:
    properties:
      account:
        maxLength: 50
        minLength: 3
        type: string
      email:
        type: string
      name:
        type: string
      passwd:
        maxLength: 100
        minLength: 6
        type: string
    required:
    - account
    - passwd
    type: object
host: localhost:8182
info:
  contact:
    email: support@iot-platform.local.local
    name: API Support
  description: IoT 物联网平台后端 API（Go 重构版）
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: IoT Platform Go API
  version: 1.7.0
paths:
  /api/devices:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ent.Device'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 查询用户设备列表
      tags:
      - devices
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备注册请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.DeviceParameters'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/service.DeviceRegisterResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 注册设备
      tags:
      - devices
  /api/devices/{deviceId}:
    get:
      consumes:
      - application/json
      description: 设备元信息 + 在线状态 + sensors（定义+latest）/ actuators（定义）物模型数组
      parameters:
      - description: 设备ID（6位hex）
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 获取设备详情（物模型视图：定义 + 最近遥测 + 执行器）
      tags:
      - devices
  /api/devices/{deviceId}/actuators:
    get:
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 查询设备执行器定义列表
      tags:
      - devices
    post:
      consumes:
      - application/json
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 执行器定义
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entity.ActuatorCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 创建执行器定义
      tags:
      - devices
  /api/devices/{deviceId}/actuators/{actuatorId}:
    get:
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 执行器标识符
        in: path
        name: actuatorId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ApiResponse'
      security:
      - UserAuth: []
      summary: 查询单个执行器定义
      tags:
      - devices
  /api/devices/{deviceId}/actuators/{actuatorId}/delete:
    post:
      parameters:
      - description: 设备ID
        in: path
        name: deviceId
        required: true
        type: string
      - description: 执行器标识符
        in: path
        name: actuatorId
        required: true
        type: string
      produces:
